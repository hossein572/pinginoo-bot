app = "pinginoo-bot"
primary_region = "fra"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  PINGINOO_DATA_DIR = "/data"
  PORT = "8080"
  PINGINOO_DEMO = "0"

# Create once: fly volumes create pinginoo_data --region fra --size 1
[mounts]
  source = "pinginoo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Keep one machine: only one polling process may use a Telegram bot token.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
