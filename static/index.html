<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fb" />
    <meta
      name="description"
      content="پینگینو؛ کانفیگ عادی و گیمینگ، تست رایگان یک‌روزه و مدیریت سادهٔ اتصال‌های شما."
    />
    <title>پینگینو — به دنیای خودت وصل شو</title>
    <link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/static/assets/vazirmatn-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="/static/app.js" defer></script>

  <body>
    <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
    <div id="app">
      <div class="initial-loader">
        <img
          src="/static/assets/logo.svg"
          width="68"
          height="68"
          alt="پینگینو"
        /><span>یه لحظه، داریم وصل می‌شیم…</span><span class="loader"></span>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <noscript
      >برای استفاده از فروشگاه پینگینو، جاوااسکریپت مرورگر را فعال

    >
